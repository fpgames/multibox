name: Release

# Pushing a tag such as v0.1.0 builds git-multibox on the project's own
# Windows and Mac machines and publishes the archives with their checksums.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64]
    # cmd, because Windows PowerShell can turn cargo's progress on stderr into
    # a failure.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p git-multibox
      # Windows' own tar writes the zip: Compress-Archive in Windows PowerShell
      # separates paths with backslashes, which the format does not allow.
      - name: Package
        run: |
          set "NAME=git-multibox-%GITHUB_REF_NAME%-x86_64-pc-windows-msvc"
          mkdir "dist\%NAME%" || exit /b 1
          for %%f in (target\release\git-multibox.exe README.md README.en.md LICENSE-MIT LICENSE-APACHE) do (
            copy /y "%%f" "dist\%NAME%\" >nul || exit /b 1
          )
          "%SystemRoot%\System32\tar.exe" -a -cf "dist\%NAME%.zip" -C dist "%NAME%"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          set -eu
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p git-multibox --target "$target"
            name="git-multibox-$GITHUB_REF_NAME-$target"
            mkdir -p "dist/$name"
            cp "target/$target/release/git-multibox" README.md README.en.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
            # Without these, macOS metadata travels as ._ files and xattr
            # headers that other systems unpack as clutter.
            COPYFILE_DISABLE=1 /usr/bin/tar --no-xattrs --no-mac-metadata \
              -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  publish:
    needs: [windows, macos]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
    steps:
      # A directory of this job's own: the workspace holds the Windows build's.
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          Set-Location $env:RELEASE_DIR
          $files = Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name
          $sums = $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS", (($sums -join "`n") + "`n"))
          # gh reports progress on stderr; its exit code decides.
          $ErrorActionPreference = 'Continue'
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes @($files.Name) SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
